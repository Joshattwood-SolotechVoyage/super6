<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Super 6 — PIN Login Test</title>
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#123f2d;color:#f5eedf;margin:0;padding:32px}
    .card{max-width:620px;margin:40px auto;background:#f5eedf;color:#153b2b;border-radius:18px;padding:24px;box-shadow:0 18px 50px #0004}
    h1{margin-top:0}label{display:block;font-weight:700;margin:14px 0 6px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #bbb;border-radius:9px;font-size:16px}
    button{margin-top:16px;padding:12px 18px;border:0;border-radius:9px;background:#153b2b;color:#fff;font-weight:800;font-size:16px;cursor:pointer}.secondary{background:#ddd;color:#153b2b;margin-left:8px}
    pre{white-space:pre-wrap;background:#e9e1d2;padding:14px;border-radius:10px;min-height:90px}.ok{color:#146c2e}.bad{color:#a32727}.muted{opacity:.75;font-size:14px}
  </style>
</head>
<body>
  <div class="card">
    <h1>SUPER 6 — PIN Login Test</h1>
    <p class="muted">Temporary end-to-end test of the real Username + 4-digit PIN login. The PIN is sent over HTTPS to the secure Supabase Edge Function and is not stored by this page.</p>
    <form id="form">
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" value="Admin" maxlength="80" required />
      <label for="pin">4-digit PIN</label>
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" pattern="[0-9]{4}" maxlength="4" required />
      <button type="submit">Test PIN login</button>
      <button id="signout" type="button" class="secondary">Sign out</button>
    </form>
    <h3>Result</h3>
    <pre id="result">Waiting for test…</pre>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
  (() => {
    const out = document.getElementById('result');
    const cfg = window.SUPER6_CONFIG || {};
    const show = (text, ok=false) => { out.textContent = text; out.className = ok ? 'ok' : 'bad'; };

    if (!cfg.SUPABASE_URL || !cfg.SUPABASE_PUBLISHABLE_KEY) {
      show('Missing Supabase URL or publishable key in config.js');
      return;
    }

    const client = supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY,
      { db: { schema: cfg.SUPABASE_SCHEMA || 'super6' } }
    );

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      out.className = '';
      out.textContent = 'Checking PIN…';

      const username = document.getElementById('username').value.trim();
      const pin = document.getElementById('pin').value.trim();

      if (!username || !/^\d{4}$/.test(pin)) {
        return show('Enter a username and a 4-digit PIN.');
      }

      try {
        const response = await fetch(
          cfg.SUPABASE_URL + '/functions/v1/super6-pin-login',
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'apikey': cfg.SUPABASE_PUBLISHABLE_KEY
            },
            body: JSON.stringify({ username, pin })
          }
        );

        const payload = await response.json().catch(() => ({}));

        if (!response.ok || !payload?.ok || !payload?.token_hash) {
          return show(payload?.error || ('PIN login failed (' + response.status + ')'));
        }

        out.textContent = 'PIN accepted. Creating Supabase session…';

        const { data: sessionData, error: sessionError } = await client.auth.verifyOtp({
          token_hash: payload.token_hash,
          type: 'email'
        });

        if (sessionError || !sessionData?.session || !sessionData?.user) {
          return show('PIN accepted, but session creation failed\n' + (sessionError?.message || 'No session returned'));
        }

        const uid = sessionData.user.id;

        const { data: profile, error: profileError } = await client
          .from('profiles')
          .select('username, role')
          .eq('id', uid)
          .single();

        if (profileError) {
          return show('SESSION OK, PROFILE CHECK FAILED\n' + profileError.message);
        }

        const { data: leagues, error: leaguesError } = await client
          .from('leagues')
          .select('name')
          .order('sort_order');

        if (leaguesError) {
          return show('SESSION + PROFILE OK, LEAGUE READ FAILED\n' + leaguesError.message);
        }

        document.getElementById('pin').value = '';

        show(
          'SUCCESS ✓\n\n' +
          'Username + PIN accepted\n' +
          'Signed in as: ' + profile.username + '\n' +
          'Role: ' + profile.role + '\n' +
          'Leagues visible: ' + leagues.length + '\n\n' +
          leagues.map(x => '• ' + x.name).join('\n'),
          true
        );
      } catch (err) {
        show('LOGIN TEST FAILED\n' + (err?.message || String(err)));
      }
    });

    document.getElementById('signout').addEventListener('click', async () => {
      await client.auth.signOut();
      document.getElementById('pin').value = '';
      out.className = '';
      out.textContent = 'Signed out.';
    });
  })();
  </script>
</body>
</html>
