<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Super 6 — Supabase Auth Test</title>
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#123f2d;color:#f5eedf;margin:0;padding:32px}
    .card{max-width:620px;margin:40px auto;background:#f5eedf;color:#153b2b;border-radius:18px;padding:24px;box-shadow:0 18px 50px #0004}
    h1{margin-top:0}label{display:block;font-weight:700;margin:14px 0 6px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #bbb;border-radius:9px;font-size:16px}
    button{margin-top:16px;padding:12px 18px;border:0;border-radius:9px;background:#153b2b;color:#fff;font-weight:800;font-size:16px;cursor:pointer}.secondary{background:#ddd;color:#153b2b;margin-left:8px}
    pre{white-space:pre-wrap;background:#e9e1d2;padding:14px;border-radius:10px;min-height:90px}.ok{color:#146c2e}.bad{color:#a32727}.muted{opacity:.75;font-size:14px}
  </style>
</head>
<body>
  <div class="card">
    <h1>SUPER 6 — Supabase Test</h1>
    <p class="muted">Temporary connection test. Your password is sent directly to Supabase Auth and is not stored by this page.</p>
    <form id="form">
      <label for="email">Admin email</label>
      <input id="email" type="email" autocomplete="username" value="admin@ssuper6.com" required />
      <label for="password">Supabase admin password</label>
      <input id="password" type="password" autocomplete="current-password" required />
      <button type="submit">Test real login</button>
      <button id="signout" type="button" class="secondary">Sign out</button>
    </form>
    <h3>Result</h3>
    <pre id="result">Waiting for test…</pre>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
  (() => {
    const out = document.getElementById('result');
    const cfg = window.SUPER6_CONFIG || {};
    const show = (text, ok=false) => { out.textContent = text; out.className = ok ? 'ok' : 'bad'; };
    if (!cfg.SUPABASE_URL || !cfg.SUPABASE_PUBLISHABLE_KEY) {
      show('Missing Supabase URL or publishable key in config.js');
      return;
    }
    const client = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_PUBLISHABLE_KEY, { db: { schema: cfg.SUPABASE_SCHEMA || 'super6' } });

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      out.className = '';
      out.textContent = 'Signing in…';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const { data, error } = await client.auth.signInWithPassword({ email, password });
      if (error) return show('LOGIN FAILED\n' + error.message);

      const uid = data.user.id;
      const { data: profile, error: profileError } = await client
        .from('profiles')
        .select('username, role')
        .eq('id', uid)
        .single();
      if (profileError) return show('AUTH OK, PROFILE CHECK FAILED\n' + profileError.message);

      const { data: leagues, error: leaguesError } = await client
        .from('leagues')
        .select('name')
        .order('sort_order');
      if (leaguesError) return show('AUTH + PROFILE OK, LEAGUE READ FAILED\n' + leaguesError.message);

      show(
        'SUCCESS ✓\n\n' +
        'Signed in as: ' + profile.username + '\n' +
        'Role: ' + profile.role + '\n' +
        'Leagues visible: ' + leagues.length + '\n\n' +
        leagues.map(x => '• ' + x.name).join('\n'),
        true
      );
    });

    document.getElementById('signout').addEventListener('click', async () => {
      await client.auth.signOut();
      document.getElementById('password').value = '';
      out.className = '';
      out.textContent = 'Signed out.';
    });
  })();
  </script>
</body>
</html>
